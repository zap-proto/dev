name: Build & publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate MDX source map
        run: node node_modules/@hanzo/docs-mdx/dist/bin.js

      - name: Build static export
        run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.spa
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zap-proto/dev-site:latest
            ghcr.io/zap-proto/dev-site:${{ github.sha }}
